# Company watchlist. Each run reads these companies' own job boards directly.
#
# Easiest: give careers_url and the scraper finds the job board (Greenhouse, Lever, Ashby,
# Workday or SmartRecruiters) on that page and caches it in data/discovered.json.
# If discovery fails, the Settings > Sources panel in the app says so; then set it by hand:
#   ats: greenhouse | lever | ashby | smartrecruiters   plus   slug: <board name in the URL>
#   ats: workday   plus   workday: {host: acme.wd5.myworkdayjobs.com, tenant: acme, site: External}
#   search: [SAP, ERP]   (Workday only: search terms to run on that board)
#
# kind: startup | manufacturer | si | pe | quant   (adds a tag)
# stage: seed | series-a | series-b | growth       (startups only)
#
# None of these slugs or URLs has been checked against the live sites yet. Run once and
# look at the Sources panel.

