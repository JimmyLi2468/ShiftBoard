name: Daily job scan

on:
  schedule:
    - cron: "15 11 * * *"   # 11:15 UTC = 7:15 AM Eastern in summer, 6:15 AM in winter
  workflow_dispatch:         # lets you run it from the Actions tab

permissions:
  contents: write   # commit the refreshed data
  pages: write      # publish the site
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # The board index (thousands of employers' job boards, built from Common Crawl) is kept in
      # the Actions cache rather than committed, so the repo doesn't grow every day.
      - name: Restore the board index
        uses: actions/cache@v4
        with:
          path: data/index
          key: board-index-${{ github.run_id }}
          restore-keys: board-index-

      - name: Fetch, tag and write jobs
        run: python -m scraper.run
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

      - name: Commit data
        run: |
          git config user.name "shift-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data data
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
